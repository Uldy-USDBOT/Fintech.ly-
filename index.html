<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fintech.ly — Premium Domain For Sale | دومين مميز للبيع</title>
    <meta name="description" content="fintech.ly — A premium domain for fintech ventures. Available for immediate acquisition.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #fafbfc;
            --bg-warm: #f5f3ef;
            --surface: #ffffff;
            --surface-hover: #f8f9fa;
            --border: rgba(0,0,0,0.06);
            --border-light: rgba(0,0,0,0.04);
            --text: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --primary: #1e3a5f;
            --primary-light: #2d5a8a;
            --accent: #c9a84c;
            --accent-light: #e8d5a0;
            --accent-bg: rgba(201,168,76,0.08);
            --success: #059669;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.08);
            --shadow-xl: 0 30px 80px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Noto Sans Arabic', 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            line-height: 1.7;
        }

        /* ===== LANGUAGE SWITCHER ===== */
        .lang-switch {
            position: fixed;
            top: 90px;
            left: 1.5rem;
            z-index: 999;
            display: flex;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .lang-switch button {
            padding: 0.5rem 1rem;
            border: none;
            background: transparent;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s;
        }
        .lang-switch button.active {
            background: var(--primary);
            color: white;
        }
        .lang-switch button:hover:not(.active) {
            color: var(--primary);
            background: var(--bg);
        }

        /* ===== ANIMATED BACKGROUND ===== */
        .bg-canvas {
            position: fixed; inset: 0; z-index: -1;
            background: linear-gradient(135deg, #fafbfc 0%, #f0eeea 50%, #f5f3ef 100%);
            overflow: hidden;
        }
        .bg-canvas::before {
            content: ''; position: absolute;
            width: 800px; height: 800px;
            top: -200px; right: -200px;
            background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%);
            animation: float-slow 20s ease-in-out infinite;
        }
        .bg-canvas::after {
            content: ''; position: absolute;
            width: 600px; height: 600px;
            bottom: -100px; left: -100px;
            background: radial-gradient(circle, rgba(30,58,95,0.04) 0%, transparent 70%);
            animation: float-slow 25s ease-in-out infinite reverse;
        }
        @keyframes float-slow {
            0%, 100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(40px,-30px) scale(1.05); }
            66% { transform: translate(-20px,20px) scale(0.95); }
        }

        .grid-overlay {
            position: fixed; inset: 0; z-index: -1;
            background-image:
                linear-gradient(rgba(0,0,0,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        /* ===== NAVBAR ===== */
        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            padding: 0 2rem;
            background: rgba(250,251,252,0.85);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--border-light);
            transition: all 0.4s;
        }
        nav.scrolled {
            box-shadow: var(--shadow);
            background: rgba(250,251,252,0.95);
        }
        nav .container {
            max-width: 1100px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center;
            height: 72px;
        }
        .nav-logo {
            font-family: 'Inter', sans-serif;
            font-size: 1.4rem; font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: -1px;
            position: relative;
        }
        .nav-logo::after {
            content: '.ly'; color: var(--accent); font-weight: 600;
        }
        .nav-links {
            display: flex; align-items: center; gap: 2rem;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.88rem; font-weight: 500;
            transition: color 0.3s;
            position: relative;
        }
        .nav-links a::after {
            content: ''; position: absolute;
            bottom: -4px; left: 0; right: 0;
            height: 2px; background: var(--accent);
            transform: scaleX(0); transform-origin: left;
            transition: transform 0.3s;
        }
        .nav-links a:hover { color: var(--primary); }
        .nav-links a:hover::after { transform: scaleX(1); }
        .nav-cta {
            background: var(--primary);
            color: white !important;
            padding: 0.55rem 1.3rem;
            border-radius: 8px;
            font-size: 0.85rem; font-weight: 600;
            transition: all 0.3s;
        }
        .nav-cta:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(30,58,95,0.2);
        }
        .nav-cta::after { display: none !important; }

        /* ===== HERO ===== */
        .hero {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 8rem 1.5rem 5rem;
            position: relative;
        }
        .hero-inner {
            max-width: 800px; width: 100%; text-align: center;
        }

        .hero-badge {
            display: inline-flex; align-items: center; gap: 0.6rem;
            background: var(--accent-bg);
            border: 1px solid rgba(201,168,76,0.2);
            padding: 0.5rem 1.2rem;
            border-radius: 999px;
            margin-bottom: 2rem;
            animation: fadeInDown 0.8s ease-out;
        }
        .hero-badge .dot {
            width: 7px; height: 7px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }
        .hero-badge span {
            font-size: 0.8rem; font-weight: 600;
            color: var(--success);
            letter-spacing: 0.5px;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(5,150,105,0.4); }
            50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(5,150,105,0); }
        }

        .hero-title {
            font-family: 'Inter', sans-serif;
            font-size: clamp(3.5rem, 10vw, 7rem);
            font-weight: 900;
            color: var(--primary);
            letter-spacing: -3px;
            line-height: 1;
            margin-bottom: 1.5rem;
            animation: fadeInUp 1s ease-out 0.2s both;
        }
        .hero-title .tld {
            color: var(--accent);
            font-weight: 700;
        }

        .hero-tagline {
            max-width: 550px; margin: 0 auto 3rem;
            animation: fadeInUp 1s ease-out 0.4s both;
        }
        .hero-tagline p {
            font-size: 1.15rem; font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
        }

        .hero-visual {
            display: flex; justify-content: center; gap: 1rem;
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease-out 0.6s both;
        }
        .viz-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem 2rem;
            text-align: center;
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
            position: relative;
            overflow: hidden;
        }
        .viz-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            transform: scaleX(0); transform-origin: left;
            transition: transform 0.5s;
        }
        .viz-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-xl);
        }
        .viz-card:hover::before { transform: scaleX(1); }
        .viz-card .icon {
            width: 48px; height: 48px;
            background: var(--accent-bg);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 0.8rem;
            font-size: 1.3rem;
            color: var(--accent);
        }
        .viz-card h4 {
            font-size: 0.85rem; font-weight: 700;
            color: var(--text);
            margin-bottom: 0.2rem;
        }
        .viz-card p {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem; color: var(--text-muted);
        }

        .scroll-hint {
            animation: fadeInUp 1s ease-out 1s both;
            margin-top: 1rem;
        }
        .scroll-hint a {
            display: inline-flex; flex-direction: column; align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            transition: color 0.3s;
        }
        .scroll-hint a:hover { color: var(--primary); }
        .scroll-hint .mouse {
            width: 22px; height: 34px;
            border: 2px solid currentColor;
            border-radius: 11px;
            position: relative;
        }
        .scroll-hint .mouse::after {
            content: ''; position: absolute;
            top: 6px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 6px;
            background: currentColor;
            border-radius: 2px;
            animation: scroll-wheel 2s infinite;
        }
        @keyframes scroll-wheel {
            0% { top: 6px; opacity: 1; }
            100% { top: 18px; opacity: 0; }
        }

        /* ===== ARTICLES ===== */
        .articles-wrap {
            background: var(--bg-warm);
            padding: 6rem 1.5rem;
            position: relative;
        }
        .articles-wrap::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
        }
        .articles-inner {
            max-width: 900px; margin: 0 auto;
        }

        .sec-header {
            text-align: center; margin-bottom: 4rem;
        }
        .sec-header h2 {
            font-size: 2.2rem; font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }
        .sec-header .en-title {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem; font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .sec-header p {
            color: var(--text-secondary);
            font-size: 1rem; margin-top: 0.8rem;
            max-width: 500px; margin-left: auto; margin-right: auto;
        }

        .article-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
            position: relative;
            overflow: hidden;
        }
        .article-card::before {
            content: ''; position: absolute; top: 0; right: 0;
            width: 4px; height: 0;
            background: linear-gradient(180deg, var(--accent), var(--primary));
            transition: height 0.5s;
        }
        .article-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
            border-color: rgba(201,168,76,0.2);
        }
        .article-card:hover::before { height: 100%; }

        .article-num {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem; font-weight: 800;
            color: var(--accent);
            background: var(--accent-bg);
            border: 1px solid rgba(201,168,76,0.15);
            padding: 0.25rem 0.7rem;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }
        .article-card h3 {
            font-size: 1.3rem; font-weight: 700;
            color: var(--text);
            margin-bottom: 0.3rem;
            line-height: 1.4;
        }
        .article-card .en-heading {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem; font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-style: italic;
        }
        .article-card p {
            color: var(--text-secondary);
            font-size: 0.92rem; line-height: 1.9;
        }
        .article-card ul {
            list-style: none; margin-top: 1.2rem;
        }
        .article-card ul li {
            color: var(--text-secondary); font-size: 0.88rem;
            padding: 0.5rem 0; padding-right: 1.6rem;
            position: relative;
            border-bottom: 1px solid var(--border-light);
        }
        .article-card ul li:last-child { border-bottom: none; }
        .article-card ul li::before {
            content: ''; position: absolute; right: 0; top: 50%; transform: translateY(-50%);
            width: 6px; height: 6px;
            background: var(--accent);
            border-radius: 50%;
        }

        /* ===== STATS STRIP ===== */
        .stats-strip {
            background: var(--primary);
            padding: 3rem 1.5rem;
            position: relative; overflow: hidden;
        }
        .stats-strip::before {
            content: ''; position: absolute;
            top: -50%; left: -20%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(201,168,76,0.1) 0%, transparent 70%);
        }
        .stats-inner {
            max-width: 1000px; margin: 0 auto;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 2rem;
            position: relative; z-index: 1;
        }
        .stat-item { text-align: center; }
        .stat-item .num {
            font-family: 'Inter', sans-serif;
            font-size: 2.2rem; font-weight: 800;
            color: var(--accent-light);
            display: block;
            margin-bottom: 0.3rem;
        }
        .stat-item .lbl-ar {
            font-size: 0.8rem; font-weight: 600;
            color: rgba(255,255,255,0.8);
        }
        .stat-item .lbl-en {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem; color: rgba(255,255,255,0.5);
            display: block; margin-top: 0.1rem;
        }

        /* ===== CONTACT SECTION (BOTTOM) ===== */
        .contact-section {
            padding: 6rem 1.5rem;
            background: var(--bg);
            position: relative;
        }
        .contact-inner {
            max-width: 600px; margin: 0 auto;
        }
        .contact-header {
            text-align: center; margin-bottom: 2.5rem;
        }
        .contact-header h2 {
            font-size: 2rem; font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.3rem;
        }
        .contact-header .en {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem; color: var(--text-muted);
            letter-spacing: 2px; text-transform: uppercase;
        }
        .contact-header p {
            color: var(--text-secondary);
            font-size: 0.95rem; margin-top: 0.8rem;
        }

        .contact-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }
        .contact-card::after {
            content: ''; position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--primary), var(--accent));
            background-size: 200% 100%;
            animation: shimmer 3s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .form-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
            margin-bottom: 1rem;
        }
        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            font-size: 0.8rem; font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%; padding: 0.9rem 1rem;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: inherit; font-size: 0.9rem;
            transition: all 0.3s;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--surface);
            box-shadow: 0 0 0 4px var(--accent-bg);
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder { color: var(--text-muted); }
        .form-group textarea { min-height: 120px; resize: vertical; }

        .btn-submit {
            width: 100%; padding: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white; font-family: inherit;
            font-size: 0.95rem; font-weight: 700;
            border: none; border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s;
            display: flex; align-items: center; justify-content: center; gap: 0.6rem;
            position: relative; overflow: hidden;
        }
        .btn-submit::before {
            content: ''; position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(30,58,95,0.25);
        }
        .btn-submit:hover::before { left: 100%; }

        .form-note {
            text-align: center; margin-top: 1.2rem;
            font-size: 0.8rem; color: var(--text-muted);
        }
        .form-note i { color: var(--success); margin-left: 0.3rem; }

        /* ===== FOOTER ===== */
        footer {
            text-align: center; padding: 3rem 1.5rem;
            border-top: 1px solid var(--border-light);
            background: var(--surface);
        }
        footer .domain {
            font-family: 'Inter', sans-serif;
            font-weight: 800; color: var(--primary);
        }
        footer .domain .tld { color: var(--accent); }
        footer p {
            color: var(--text-muted); font-size: 0.85rem;
        }
        footer .en {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem; color: var(--text-muted);
            margin-top: 0.3rem;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .reveal {
            opacity: 0; transform: translateY(50px);
            transition: all 0.9s cubic-bezier(0.16,1,0.3,1);
        }
        .reveal.visible {
            opacity: 1; transform: translateY(0);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .lang-switch { top: 80px; left: 1rem; }
            .nav-links { display: none; }
            .hero-title { font-size: 3rem; letter-spacing: -1px; }
            .hero-visual { flex-wrap: wrap; }
            .viz-card { flex: 1 1 45%; }
            .stats-inner { grid-template-columns: repeat(2, 1fr); }
            .form-row { grid-template-columns: 1fr; }
            .article-card { padding: 1.8rem; }
        }
    </style>

    <script>
        // Language Switcher
        let currentLang = 'ar';

        function setLang(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

            document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');

            document.querySelectorAll('[data-ar][data-en]').forEach(el => {
                if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                    el.placeholder = el.getAttribute('data-' + lang);
                } else if (el.tagName === 'OPTION') {
                    el.textContent = el.getAttribute('data-' + lang);
                } else {
                    el.textContent = el.getAttribute('data-' + lang);
                }
            });

            document.querySelectorAll('select').forEach(select => {
                Array.from(select.options).forEach(opt => {
                    if (opt.getAttribute('data-' + lang)) {
                        opt.textContent = opt.getAttribute('data-' + lang);
                    }
                });
            });
        }

        setLang('ar');

        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            navbar.classList.toggle('scrolled', window.scrollY > 50);
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(e => {
                if (e.isIntersecting) e.target.classList.add('visible');
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -60px 0px' });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        document.querySelectorAll('a[href^="#"]').forEach(a => {
            a.addEventListener('click', function(e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        });
    </script>
